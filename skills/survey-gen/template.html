<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사용자 결정 설문</title>
<!-- survey-gen이 만든 파일이다. 손으로 고치지 않는다(설문 데이터는 아래 survey-data 스크립트에 들어간다). -->
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #5d6676; --line: #d9dde4;
    --accent: #2457d6; --accent-text: #fff; --rec: #1c7c4d; --rec-bg: #e6f4ec; --warn: #b4540a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171d; --card: #1d222b; --text: #e6e9ef; --muted: #9aa3b2; --line: #343b48;
      --accent: #6b93ff; --accent-text: #0d1220; --rec: #5fd39a; --rec-bg: #17301f; --warn: #f0a15a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, "Malgun Gothic", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 120px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .note { color: var(--muted); margin: 0 0 20px; white-space: pre-wrap; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .progress { color: var(--muted); font-size: 14px; margin-left: auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .card.unanswered.flag { border-color: var(--warn); }
  .card h2 { font-size: 16px; margin: 0 0 8px; }
  .card h2 .no { color: var(--accent); margin-right: 6px; }
  .meta { margin: 4px 0; white-space: pre-wrap; }
  .meta b { color: var(--muted); font-weight: 600; }
  .opts { display: flex; flex-direction: column; gap: 8px; margin: 12px 0 8px; }
  button { font: inherit; cursor: pointer; }
  .opt { text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); }
  .opt:hover { border-color: var(--accent); }
  .opt[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .opt .tag { font-size: 12px; margin-left: 8px; padding: 1px 6px; border-radius: 10px; background: var(--rec-bg); color: var(--rec); }
  .opt[aria-pressed="true"] .tag { background: rgba(255,255,255,.25); color: inherit; }
  textarea.memo { width: 100%; min-height: 40px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; resize: vertical; }
  .btn { padding: 8px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 10px 16px; display: flex; gap: 8px; justify-content: center; }
  #result-wrap { display: none; margin-top: 20px; }
  #result { width: 100%; min-height: 220px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); font: 14px/1.5 ui-monospace, Consolas, monospace; }
  .toast { color: var(--rec); font-weight: 600; margin-left: 8px; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="note" id="note"></p>
  <div class="toolbar">
    <button class="btn" id="btn-rec" type="button">권고안 일괄 선택</button>
    <button class="btn" id="btn-clear" type="button">선택 초기화</button>
    <span class="progress" id="progress"></span>
  </div>
  <div id="items"></div>
  <div id="result-wrap">
    <h2 style="font-size:16px">응답 텍스트 <span class="toast" id="toast"></span></h2>
    <textarea id="result" readonly></textarea>
  </div>
</main>
<div class="bar">
  <button class="btn primary" id="btn-gen" type="button">답변 생성 및 복사</button>
</div>

<script id="survey-data" type="application/json">
__SURVEY_DATA_JSON__
</script>

<script>
(function () {
  var data = JSON.parse(document.getElementById('survey-data').textContent);
  var answers = {};   // id -> key
  var memos = {};     // id -> text
  var storeKey = 'survey:' + location.pathname + ':' + data.title;

  try {
    var saved = JSON.parse(localStorage.getItem(storeKey) || 'null');
    if (saved) { answers = saved.answers || {}; memos = saved.memos || {}; }
  } catch (e) {}
  function persist() {
    try { localStorage.setItem(storeKey, JSON.stringify({ answers: answers, memos: memos })); } catch (e) {}
  }

  document.getElementById('title').textContent = data.title;
  document.getElementById('note').textContent = data.note || '';
  document.title = data.title;

  var host = document.getElementById('items');
  data.items.forEach(function (it) {
    var card = document.createElement('section');
    card.className = 'card unanswered';
    card.dataset.id = it.id;

    var h = document.createElement('h2');
    var no = document.createElement('span'); no.className = 'no'; no.textContent = it.id + '.';
    h.appendChild(no); h.appendChild(document.createTextNode(it.title));
    card.appendChild(h);

    function meta(label, text) {
      if (!text) return;
      var p = document.createElement('div'); p.className = 'meta';
      var b = document.createElement('b'); b.textContent = label + ': ';
      p.appendChild(b); p.appendChild(document.createTextNode(text));
      card.appendChild(p);
    }
    meta('배경', it.background);
    if (it.recommend) {
      meta('권고', it.recommend + (it.recommendReason ? ' — ' + it.recommendReason : ''));
    }
    meta('응답 전 보류 작업', it.hold);

    var opts = document.createElement('div'); opts.className = 'opts';
    it.options.forEach(function (o) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'opt'; b.dataset.key = o.key;
      b.setAttribute('aria-pressed', 'false');
      b.appendChild(document.createTextNode(o.key + '. ' + o.label));
      if (o.key === it.recommend) {
        var t = document.createElement('span'); t.className = 'tag'; t.textContent = '권고';
        b.appendChild(t);
      }
      b.addEventListener('click', function () {
        // 같은 버튼을 다시 누르면 선택 해제
        if (answers[it.id] === o.key) delete answers[it.id]; else answers[it.id] = o.key;
        render(); persist();
      });
      opts.appendChild(b);
    });
    card.appendChild(opts);

    var memo = document.createElement('textarea');
    memo.className = 'memo'; memo.placeholder = '메모(선택): 조건·추가 지시가 있으면 적어 주세요';
    memo.value = memos[it.id] || '';
    memo.addEventListener('input', function () { memos[it.id] = memo.value; persist(); });
    card.appendChild(memo);

    host.appendChild(card);
  });

  function render() {
    var done = 0;
    data.items.forEach(function (it) {
      var card = host.querySelector('[data-id="' + it.id + '"]');
      var sel = answers[it.id];
      if (sel) done++;
      card.classList.toggle('unanswered', !sel);
      card.querySelectorAll('.opt').forEach(function (b) {
        b.setAttribute('aria-pressed', b.dataset.key === sel ? 'true' : 'false');
      });
    });
    document.getElementById('progress').textContent = done + ' / ' + data.items.length + ' 응답';
  }

  function build() {
    var lines = ['[' + data.title + ' 응답]'];
    var missing = [];
    data.items.forEach(function (it) {
      var key = answers[it.id];
      if (!key) {
        missing.push(it.id);
        var um = (memos[it.id] || '').trim();
        if (um) lines.push(it.id + '. ' + it.title + ' → (선택 없음)\n   메모: ' + um.replace(/\n/g, '\n   '));
        return;
      }
      var opt = it.options.filter(function (o) { return o.key === key; })[0];
      lines.push(it.id + '. ' + it.title + ' → ' + key + '. ' + (opt ? opt.label : ''));
      var m = (memos[it.id] || '').trim();
      if (m) lines.push('   메모: ' + m.replace(/\n/g, '\n   '));
    });
    lines.push(missing.length ? '미응답: ' + missing.join(', ') : '미응답: 없음');
    return lines.join('\n');
  }

  function copy(text) {
    function fallback() {
      var ta = document.getElementById('result');
      ta.focus(); ta.select();
      try { return document.execCommand('copy'); } catch (e) { return false; }
    }
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return fallback(); });
    }
    return Promise.resolve(fallback());
  }

  document.getElementById('btn-gen').addEventListener('click', function () {
    var text = build();
    var area = document.getElementById('result');
    area.value = text;
    document.getElementById('result-wrap').style.display = 'block';
    var toast = document.getElementById('toast');
    // 미응답 문항 강조
    host.querySelectorAll('.card').forEach(function (c) { c.classList.toggle('flag', c.classList.contains('unanswered')); });
    copy(text).then(function (ok) {
      toast.textContent = ok ? '클립보드에 복사했습니다.' : '자동 복사 실패 — 아래 텍스트를 직접 복사하세요.';
      area.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  });

  document.getElementById('btn-rec').addEventListener('click', function () {
    data.items.forEach(function (it) { if (it.recommend && !answers[it.id]) answers[it.id] = it.recommend; });
    render(); persist();
  });
  document.getElementById('btn-clear').addEventListener('click', function () {
    answers = {}; memos = {};
    host.querySelectorAll('textarea.memo').forEach(function (t) { t.value = ''; });
    render(); persist();
  });

  render();
})();
</script>
</body>
</html>
